name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Formula
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run brew audit
        run: |
          brew audit --strict Formula/tinkerdown.rb || true

      - name: Run brew style
        run: |
          brew style Formula/tinkerdown.rb

  test:
    name: Test Installation
    runs-on: ${{ matrix.os }}
    # Only run on main branch after release is available
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install formula
        run: |
          brew install ./Formula/tinkerdown.rb

      - name: Verify installation
        run: |
          tinkerdown version
          tinkerdown --help
