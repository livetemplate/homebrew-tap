name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Formula
    # brew style runs the same on Linux, and the macOS queue left this job
    # without a runner for 15 minutes three times.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Put Homebrew on PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Run brew audit
        run: |
          brew audit --strict Formula/tinkerdown.rb || true

      - name: Run brew style
        run: |
          brew style Formula/tinkerdown.rb

  test:
    name: Test Installation
    runs-on: ${{ matrix.os }}
    # A formula bump lands after its release is published, so the install
    # test can run on the PR too.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Ubuntu image ships Linuxbrew but leaves it off PATH.
      - name: Put Homebrew on PATH
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      # Homebrew installs only from a tap, not a formula path, so tap this
      # checkout under the name users tap.
      - name: Install formula
        run: |
          brew tap livetemplate/tap "$GITHUB_WORKSPACE"
          brew install livetemplate/tap/tinkerdown

      - name: Verify installation
        run: |
          tinkerdown version
          tinkerdown --help
